name: release

# Every push to main updates a release PR (version + CHANGELOG from the
# Conventional Commits since the last release). Merging that PR creates the
# tag and the GitHub release; the publish job then builds the binaries,
# attests where they were built, and attaches them.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      # A GitHub App token, not GITHUB_TOKEN: the App is the only non-admin
      # allowed to create v* tags (ruleset), and a release PR it opens runs CI.
      # The token is cut down to this repository, contents and pull requests.
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.TW_CI_APP_ID }}
          private-key: ${{ secrets.TW_CI_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # upload the assets
      id-token: write      # sign the provenance attestation
      attestations: write  # store it
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable   # the newest toolchain: its standard library ships in the binaries
          check-latest: true
          cache: false

      - name: Tag must be a semantic version
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || {
            echo "::error::$TAG is not a semantic version"; exit 1; }

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: |
          mkdir dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os=${target%/*}; arch=${target#*/}
            name="headvpn_${TAG#v}_${os}_${arch}"
            mkdir "build-$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$TAG" \
              -o "build-$name/headvpn" ./cmd/headvpn
            cp LICENSE README.md "build-$name/"
            tar -C "build-$name" -czf "dist/$name.tar.gz" headvpn LICENSE README.md
          done
          (cd dist && sha256sum -- *.tar.gz > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
